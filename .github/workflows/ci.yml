name: CI Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      - name: Restore
        run: |
          dotnet restore src/ElBruno.Whisper/ElBruno.Whisper.csproj
          dotnet restore src/ElBruno.Whisper.BlazorComponents/ElBruno.Whisper.BlazorComponents.csproj
          dotnet restore src/tests/ElBruno.Whisper.Tests/ElBruno.Whisper.Tests.csproj
          dotnet restore src/samples/BlazorWhisper/BlazorWhisper.csproj

      - name: Build
        run: |
          dotnet build src/ElBruno.Whisper/ElBruno.Whisper.csproj --no-restore
          dotnet build src/ElBruno.Whisper.BlazorComponents/ElBruno.Whisper.BlazorComponents.csproj --no-restore
          dotnet build src/tests/ElBruno.Whisper.Tests/ElBruno.Whisper.Tests.csproj --no-restore
          dotnet build src/samples/BlazorWhisper/BlazorWhisper.csproj --no-restore

      - name: Test
        run: dotnet test src/tests/ElBruno.Whisper.Tests/ElBruno.Whisper.Tests.csproj --no-build --verbosity normal --filter "Category!=Integration" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "**/test-results.trx"
